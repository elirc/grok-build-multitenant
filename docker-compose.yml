version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grokbuildmultitenant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_mt:/var/lib/postgresql/data

volumes:
  postgres_data_mt:
